name: Deploy Serendipity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build and validate source
        run: npm run build

      - name: Normalize GitHub Pages project paths
        run: node scripts/prepare-pages.mjs

      - name: Verify project-path build
        shell: bash
        run: |
          set -euo pipefail
          grep -q './src/app.js' _site/index.html
          grep -q 'SERENDIPITY_PAGES_BASE:/serendipity-archive-v0.1.0' _site/src/app.js
          grep -q 'SERENDIPITY_PAGES_BASE:/serendipity-archive-v0.1.0' _site/src/search.js
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/site.webmanifest
          test -f _site/favicon.svg
          test -f _site/src/runtime.js
          test -f _site/src/image-map.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
