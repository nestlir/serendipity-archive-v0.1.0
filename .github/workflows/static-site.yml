name: Serendipity static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/site.webmanifest
          test -f public/favicon.svg
          test -f src/app.js
          test -f src/content.js
          test -f src/image-map.js
          test -f src/runtime.js
          test -f src/styles.css
          test -f src/search.js
          test -f src/collection.js
          test -f src/polish.css
          test -f src/qa.css
          test -f src/performance.css
          test -f src/production-ui.css

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/search.js
          node --check src/collection.js
          node --check src/discovery.js
          node --check src/assets.js
          node --check src/image-map.js
          node --check src/runtime.js
          node --check scripts/prepare-pages.mjs

      - name: Check temporary assets are not accidentally hidden
        shell: bash
        run: |
          set -euo pipefail
          grep -R "UNVERIFIED\|temporary" docs/PROVENANCE.md src/assets.js >/dev/null

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R src _site/
          cp -R public/. _site/
          node scripts/prepare-pages.mjs
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/site.webmanifest
          test -f _site/favicon.svg
